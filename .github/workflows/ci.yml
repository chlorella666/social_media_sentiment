name: CI

on:
  push:
  pull_request:

jobs:
  regression:
    name: regression (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # windows：完整覆盖（含 DPAPI 用例）；ubuntu：验证 runner/测试跨平台
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 一键回归（单元测试 + 黄金集词典门槛）
        run: python tests/run_regression.py --ci
        env:
          PYTHONIOENCODING: utf-8
      - name: 上传回归报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ matrix.os }}
          path: data/regression/**/report.json
          if-no-files-found: ignore
